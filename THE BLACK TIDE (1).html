<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>THE BLACK TIDE</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{--bg:#02050a;--fg:#9fb2c0;--dim:#556672;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.p{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:5}
.h{display:none!important}
h1{font-weight:400;letter-spacing:.38em;font-size:clamp(24px,6vw,54px);margin:0 0 28px;text-indent:.38em;text-shadow:0 0 30px #000}

<canvas id="c"></canvas><div id="title"></div><div id="hint"></div>
<div id="menu" class="p"><h1>THE BLACK TIDE</h1><button id="bp">PLAY</button><button id="bs">SETTINGS</button><button id="bq">QUIT</button></div>
<div id="pause" class="p h"><h2>PAUSED</h2><button id="br">RESUME</button><button id="bs2">SETTINGS</button><button id="bm">MAIN MENU</button></div>
<div id="set" class="p h"><h2>SETTINGS</h2><div id="sl"></div><button id="bf">FULLSCREEN</button><button id="bb">BACK</button></div>
<div id="touch" class="h"><div><button id="tl">◀</button><button id="tr">▶</button></div><button id="te">●</button></div>
<script>
(()=>{
const $=i=>document.getElementById(i),cv=$("c"),g=cv.getContext("2d");
const lerp=(a,b,t)=>a+(b-a)*t,cl=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a=0,b=1)=>a+Math.random()*(b-a);
const hh=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
const noise=x=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hh(i),hh(i+1),u)};
const Q={low:{rain:260,step:12,dpr:.6},med:{rain:650,step:7,dpr:.85},high:{rain:1200,step:4,dpr:1}};
let S={master:.8,ocean:.8,rain:.8,wind:.8,thunder:.8,ship:.8,shake:.6,quality:"med"};
try{Object.assign(S,JSON.parse(localStorage.getItem("bt_s")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("bt_s",JSON.stringify(S))}catch(e){}};
let W,H,hy,SC,vig;
function resize(){const d=Math.min(devicePixelRatio||1,2)*Q[S.quality].dpr;W=innerWidth;H=innerHeight;cv.width=W*d|0;cv.height=H*d|0;g.setTransform(d,0,0,d,0,0);hy=H*.4;SC=cl(H/700,.55,1.5);vig=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);vig.addColorStop(0,"rgba(0,0,0,0)");vig.addColorStop(1,"rgba(0,0,0,.7)")}
addEventListener("resize",resize);

/* ---------- WEATHER ---------- */
const Wx={rain:.45,wind:.3,sea:.35,fog:.4,storm:.4,gust:0,lull:0};
const T={rain:.45,wind:.3,sea:.35,fog:.4,storm:.4},nx={rain:5,wind:3,sea:8,fog:10,storm:20};
const RT={rain:.15,wind:.2,sea:.08,fog:.06,storm:.05};
let dirSign=1,nextGust=8,lullEnd=0,nextLull=70,rogues=[],nextRogue=18;
const windE=()=>cl(Wx.wind+Wx.gust,-1.4,1.4);
/* weather = weighted state machine; wind leads, rain follows, sea lags behind sustained wind */
const WS={calm:{r:[0,.08],w:[.03,.28],s:[.08,.28],f:[.35,.8],st:[.05,.2]},drizzle:{r:[.15,.35],w:[.15,.4],s:[.2,.4],f:[.3,.65],st:[.15,.35]},rain:{r:[.5,.8],w:[.3,.6],s:[.35,.6],f:[.2,.5],st:[.35,.6]},squall:{r:[.75,1],w:[.7,1],s:[.5,.75],f:[.1,.3],st:[.6,.85]},storm:{r:[.6,1],w:[.75,1],s:[.75,1],f:[.1,.35],st:[.8,1]},fogbank:{r:[.02,.15],w:[.02,.15],s:[.15,.35],f:[.8,1],st:[.05,.15]}};
const TR={calm:{drizzle:3,fogbank:2,rain:1},drizzle:{calm:2,rain:3,fogbank:1},rain:{drizzle:3,storm:2,squall:2,calm:1},squall:{storm:3,rain:3,drizzle:1},storm:{squall:3,rain:3,storm:1,drizzle:1},fogbank:{calm:3,drizzle:2}};
let wstate="drizzle",wEnd=0,rainAt=0,rainT=.3,seaBase=.3,wAvg=.3,boostEnd=0;
function setState(n,t,dur){wstate=n;const d=WS[n],pk=a=>rnd(a[0],a[1]);if(Math.random()<.25)dirSign*=-1;T.wind=dirSign*pk(d.w);T.storm=pk(d.st);rainT=pk(d.r);rainAt=rainT>Wx.rain+.2?t+rnd(8,22):t;seaBase=pk(d.s);T.fog=pk(d.f)*(1.1-.5*Math.abs(T.wind));wEnd=t+(dur||rnd(35,110))}
function weather(t,dt){
 if(t>wEnd){const w=TR[wstate],ks=Object.keys(w);let s=0;for(const k of ks)s+=w[k];let r=Math.random()*s,n=ks[0];for(const k of ks){r-=w[k];if(r<=0){n=k;break}}setState(n,t)}
 wAvg+=(Math.abs(Wx.wind)-wAvg)*dt*.03;T.sea=Math.min(1,Math.max(seaBase,wAvg*.9));
 if(t>=rainAt)T.rain=rainT;
 if(t>nextGust){const s=Wx.storm;Wx.gust=rnd(.2,.7)*(Math.random()<.6?dirSign:-dirSign)*(.4+s);nextGust=t+rnd(5,24)/(.5+s);const ga=Math.abs(Wx.gust);burst({type:"bandpass",f0:rnd(350,600),f1:rnd(700,1100),q:1.2,dur:rnd(2,4),att:rnd(1,1.8),v:.25*ga,pan:rnd(-.8,.8),ch:"wind"});if(Math.random()<.5)burst({type:"bandpass",f0:1300,f1:rnd(1500,2100),q:9,dur:rnd(1.5,3),att:1,v:.05*ga,pan:rnd(-.5,.5),ch:"wind"})}
 Wx.gust*=Math.exp(-dt*.5);
 if(t>nextLull){if(Wx.storm>.4)lullEnd=t+rnd(6,12);nextLull=t+rnd(90,200)}
 Wx.lull=lerp(Wx.lull,t<lullEnd?1:0,1-Math.exp(-dt*(t<lullEnd?1.2:.4)));
 const b=t<boostEnd?5:1;
 for(const k in T){const tv=(k=="rain"||k=="wind")?T[k]*(1-.7*Wx.lull):T[k];Wx[k]=lerp(Wx[k],tv,1-Math.exp(-dt*RT[k]*b))}
}
/* ---------- SEA ---------- */
/* swell groups: own wavelength, speed, phase and a travelling amplitude envelope (wave packets) */
const G=[[.0047,.55,3,.55,.0013],[.0105,.9,0,.5,.0021],[.021,-1.3,1.7,.3,.0034],[.043,2.1,.5,.12,.0057],[.0071,.75,5,.35,.0017]];
const RO=[0,260,520],RM=[1,.5,.22];let foamE=0,pym=0,slamT=0;
function waveY(x,t){const A0=4+Wx.sea*38;let y=0;
 for(let i=0;i<5;i++){const q=G[i],env=Math.pow(noise(x*q[4]+t*q[1]*q[4]*.9+i*7),1.3)*1.6,hf=i>=3?1-.5*Wx.sea:1;y+=q[3]*hf*env*Math.sin(x*q[0]+t*q[1]+q[2]+.6*Math.sin(x*.0013+t*.1))}
 y*=A0;
 for(let i=0;i<rogues.length;i++){const r=rogues[i];for(let s=0;s<3;s++){const d=(x-r.x-RO[s])/r.w;y-=r.amp*RM[s]*Math.exp(-d*d)}}
 return y}
const LF=[0,.25,.5,.8,1],YS=LF.map(()=>new Float32Array(2400));
const lbase=i=>hy+(H*.74-hy)*Math.pow(LF[i],1.3);
const ly=(i,x,t)=>lbase(i)+waveY(x*(1.5-.5*LF[i])+i*137,t*(.6+.5*LF[i]))*(.2+LF[i]);
/* ---------- SHIP ---------- */
const Sh={y:0,vy:0,a:0,va:0,r:0,vr:0,x:0,vx:0,cx:0,face:1,lean:0,energy:0,shake:0,la:0,lv:0,sx:0,sy:0,ang:0};
const crateLocal=34;
const deckY=x=>-24-(x+84)*.0556;
const tmp={x:0,y:0};
function tw(lx,ly_){const c=Math.cos(Sh.ang),s=Math.sin(Sh.ang);tmp.x=Sh.sx+(lx*c-ly_*s)*SC;tmp.y=Sh.sy+(lx*s+ly_*c)*SC;return tmp}
/* ---------- LIGHTNING ---------- */
const Lt={f:0,p:[],next:9,bolt:null,ix:.5,sil:0,silx:0,lastSil:-999};
function strike(t){
 const dist=Math.pow(Math.random(),.8),inten=lerp(1,.2,dist)*rnd(.6,1);
 Lt.p.length=0;Lt.p.push({at:t,v:inten*.45,c:1});const t1=t+rnd(.1,.3);Lt.p.push({at:t1,v:inten});
 if(Math.random()<.45)Lt.p.push({at:t1+rnd(.08,.2),v:inten*rnd(.5,.9)});
 if(Math.random()<.2)Lt.p.push({at:t1+rnd(.25,.45),v:inten*rnd(.4,.8)});
 if(dist>.65)for(const p of Lt.p)p.c=1;Lt.ix=rnd(.1,.9);Lt.bolt=null;
 if(dist<.55&&Math.random()<.6){const pts=[];let x=Lt.ix*W,y=-10;while(y<hy){pts.push(x,y);x+=rnd(-22,22);y+=rnd(14,30)}pts.push(x,hy);Lt.bolt=pts}
 Lt.sil=0;if(dist>.3&&Math.random()<.12&&t-Lt.lastSil>100){Lt.sil=1;Lt.silx=rnd(.15,.85)*W;Lt.lastSil=t}
 const silent=dist>.4&&Math.random()<.35;
 if(!silent)thunder(dist,.25+dist*6);
 Lt.next=t+(Math.random()<.22?rnd(.3,1.5):(2+Math.pow(Math.random(),1.6)*32)/(.3+Wx.storm*1.2));
}
function lightning(t,dt){
 if(t>Lt.next&&Wx.storm>.2)strike(t);else if(t>Lt.next)Lt.next=t+5;
 let f=0,fc=0;for(let i=Lt.p.length-1;i>=0;i--){const p=Lt.p[i],a=t-p.at;if(a>.8){Lt.p.splice(i,1);continue}if(a>=0){const v=p.v*Math.exp(-a*(p.c?5:16));if(p.c)fc=Math.max(fc,v);else f=Math.max(f,v)}}
 Lt.f=Math.min(f,.9);Lt.fc=fc;
}
/* ---------- AUDIO ---------- */
const A={ctx:null,fade:0,v:0};
function initAudio(){
 if(A.ctx){A.ctx.resume();return}
 try{const C=A.ctx=new(window.AudioContext||window.webkitAudioContext)();
 const mk=(s,l)=>{const b=C.createBuffer(2,C.sampleRate*s,C.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);let p=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;if(l){p=(p+.02*w)/1.02;d[i]=p*3.5}else d[i]=w}}return b};
 A.br=mk(10,1);A.wh=mk(4,0);A.m=C.createGain();A.m.gain.value=0;A.m.connect(C.destination);A.u={};
 for(const k of["ocean","rain","wind","thunder","ship"]){const n=C.createGain();n.connect(A.m);A.u[k]=n}
 const loop=(buf,type,f,q,dest)=>{const s=C.createBufferSource();s.buffer=buf;s.loop=true;const fl=C.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const gn=C.createGain();gn.gain.value=0;s.connect(fl);fl.connect(gn);gn.connect(dest);s.start(0,Math.random()*3);return{fl,gn}};
 A.o1=loop(A.br,"lowpass",300,.7,A.u.ocean);A.o2=loop(A.wh,"bandpass",1100,.6,A.u.ocean);
 A.r1=loop(A.wh,"highpass",1800,.5,A.u.rain);A.r2=loop(A.br,"bandpass",500,.8,A.u.rain);
 A.w1=loop(A.wh,"bandpass",400,1.4,A.u.wind);A.w2=loop(A.wh,"bandpass",1100,7,A.u.wind);
 applyVol()}catch(e){A.ctx=null}
}
function applyVol(){if(!A.ctx)return;for(const k in A.u)A.u[k].gain.value=S[k]}
function burst(o){const C=A.ctx;if(!C||A.v>14)return;A.v++;const t0=o.at||C.currentTime;
 const s=C.createBufferSource();s.buffer=o.br?A.br:A.wh;
 const f=C.createBiquadFilter();f.type=o.type||"lowpass";f.Q.value=o.q||1;f.frequency.setValueAtTime(o.f0,t0);f.frequency.exponentialRampToValueAtTime(o.f1,t0+o.dur);
 const gn=C.createGain();gn.gain.setValueAtTime(.0001,t0);gn.gain.linearRampToValueAtTime(o.v,t0+o.att);gn.gain.exponentialRampToValueAtTime(.0001,t0+o.dur);
 s.connect(f);f.connect(gn);let out=gn;if(C.createStereoPanner){const p=C.createStereoPanner();p.pan.value=o.pan||0;gn.connect(p);out=p}
 out.connect(A.u[o.ch]);s.onended=()=>A.v--;s.start(t0,Math.random()*2.5);s.stop(t0+o.dur+.1)}
function creak(p){const C=A.ctx;if(!C)return;const t0=C.currentTime,d=rnd(.5,1.8),f0=rnd(70,170);
 const o=C.createOscillator();o.type="sawtooth";o.frequency.setValueAtTime(f0,t0);o.frequency.linearRampToValueAtTime(f0*rnd(.7,1.5),t0+d);
 const l=C.createOscillator();l.frequency.value=rnd(6,22);const lg=C.createGain();lg.gain.value=f0*.25;l.connect(lg);lg.connect(o.frequency);
 const b=C.createBiquadFilter();b.type="bandpass";b.frequency.value=rnd(300,700);b.Q.value=6;
 const gn=C.createGain();gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(.14*p,t0+d*.3);gn.gain.linearRampToValueAtTime(0,t0+d);
 o.connect(b);b.connect(gn);gn.connect(A.u.ship);o.start(t0);l.start(t0);o.stop(t0+d);l.stop(t0+d)}
function thunder(dist,delay){const C=A.ctx;if(!C)return;const at=C.currentTime+delay,pan=rnd(-.7,.7);
 burst({br:1,type:"lowpass",f0:lerp(500,180,dist),f1:50,dur:lerp(4,8,dist),att:lerp(.05,.9,dist),v:lerp(2.4,.5,dist),q:.7,pan,ch:"thunder",at});
 if(dist<.5)burst({type:"bandpass",f0:2500,f1:300,dur:1.2,att:.02,v:lerp(.5,.1,dist*2),pan,ch:"thunder",at});
 if(dist<.25)burst({br:1,type:"lowpass",f0:140,f1:30,dur:5,att:.05,v:2.2,q:.5,pan:0,ch:"thunder",at});
 if(dist>.25)burst({br:1,type:"lowpass",f0:220,f1:50,dur:lerp(3,6,dist),att:.8,v:lerp(.7,.25,dist),q:.6,pan:-pan*.7,ch:"thunder",at:at+rnd(1.5,3.5)})}
let nextAmb=4,nextCreak=5,nextSlap=12;
function audioEvents(t){
 if(!A.ctx)return;
 if(t>nextAmb){const r=Math.random(),pan=rnd(-.9,.9),sea=Wx.sea;
  if(r<.35)burst({br:1,type:"lowpass",f0:260,f1:70,dur:rnd(3,5),att:rnd(1,2),v:.5+sea*.8,pan,ch:"ocean"});
  else if(r<.65)burst({type:"bandpass",f0:2200,f1:500,q:.8,dur:rnd(.7,1.4),att:.08,v:.12+sea*.25,pan,ch:"ocean"});
  else if(r<.85)burst({br:1,type:"lowpass",f0:500,f1:120,dur:1.2,att:.15,v:.5+sea,pan,ch:"ocean"});
  nextAmb=t+(Math.random()<.35?rnd(.4,1.5):rnd(4,12))*(1.7-Wx.sea)}
 const stress=Math.abs(Sh.va)+Math.abs(Sh.vr)*.6+Math.abs(Sh.vy)*.01;
 if(t>nextCreak){creak(.3+stress*.8+Wx.sea*.5);nextCreak=t+rnd(2,10)/(.3+Wx.sea+stress*1.5)}
}
function audUpd(){const C=A.ctx;if(!C)return;const tc=C.currentTime,s=(n,v,k)=>n.gain.setTargetAtTime(v,tc,k||.3),lu=1-.65*Wx.lull,sea=Wx.sea,w=Math.abs(windE());
 s(A.o1.gn,(.25+.9*sea+.6*Sh.energy)*lu*1.2);A.o1.fl.frequency.setTargetAtTime(180+420*sea+500*Sh.energy,tc,.3);
 s(A.o2.gn,(.01+.06*sea+.18*Sh.energy)*lu);
 s(A.r1.gn,Wx.rain*.2);s(A.r2.gn,Wx.rain*.5);A.r1.fl.frequency.setTargetAtTime(2600-1400*Wx.rain,tc,.5);
 s(A.w1.gn,(.03+.35*w)*lu);A.w1.fl.frequency.setTargetAtTime(250+600*w+200*noise(tm*.3),tc,.3);
 s(A.w2.gn,(.005+.06*w*w)*lu);A.w2.fl.frequency.setTargetAtTime(800+700*noise(tm*.2+9),tc,.4);
 A.m.gain.setTargetAtTime(S.master*A.fade,tc,.5)}
/* ---------- PARTICLES ---------- */
const NR=1200,RX=new Float32Array(NR),RY=new Float32Array(NR),RS=new Float32Array(NR),RL=new Uint8Array(NR);
const RLIM=[0,0,0];
function initRain(){for(let i=0;i<NR;i++){const m=i%10,l=m<5?0:m<8?1:2;RL[i]=l;RS[i]=l==0?rnd(380,520):l==1?rnd(700,900):rnd(1100,1500);RX[i]=rnd(-W*.4,W*1.4);RY[i]=rnd(0,H)}}
function rainUpd(dt){const n=(Q[S.quality].rain*Math.pow(Wx.rain,.8))|0,we=windE();RLIM[0]=hy+20;RLIM[1]=H*.72;RLIM[2]=H+30;
 for(let i=0;i<n;i++){const sp=RS[i];RY[i]+=sp*dt;RX[i]+=we*(40+sp*.22)*dt;if(RY[i]>RLIM[RL[i]]){RY[i]=-rnd(0,40);RX[i]=rnd(-W*.4,W*1.4)}}return n}
function rainDraw(l,n){const we=windE(),len=[8,14,28][l];g.lineWidth=[.6,1,1.8][l];
 g.strokeStyle=`rgba(${150+Lt.f*90|0},${170+Lt.f*70|0},${190+Lt.f*50|0},${[.1,.16,.24][l]+Lt.f*.4})`;g.beginPath();
 for(let i=0;i<n;i++){if(RL[i]!==l)continue;const sp=RS[i],vx=we*(40+sp*.22),x=RX[i],y=RY[i];g.moveTo(x,y);g.lineTo(x-vx/sp*len,y-len)}g.stroke()}
const NS=170,SP=[];for(let i=0;i<NS;i++)SP.push({a:0,x:0,y:0,vx:0,vy:0,l:0,m:1,r:1});
function spawnSplash(x,y,vx,vy,l,r){for(let i=0;i<NS;i++){const p=SP[i];if(!p.a){p.a=1;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.l=p.m=l;p.r=r;return}}}
const DR=[];for(let i=0;i<12;i++)DR.push({a:0,x:0,y:0,r:0,v:0,l:0});
function spawnDrop(){for(const d of DR)if(!d.a){d.a=1;d.x=rnd(.05,.95)*W;d.y=rnd(.1,.7)*H;d.r=rnd(2,5);d.v=rnd(4,14);d.l=rnd(3,7);return}}
const Dr=[];for(let i=0;i<20;i++)Dr.push({a:0,x:0,y:0,v:0});
/* ---------- CRASH ---------- */
let leanT=0;
function crash(side,p){
 foamE=Math.max(foamE,Math.min(1,p));Sh.va-=side*p*.55;Sh.vr+=(Math.random()<.5?-1:1)*p*1.3;Sh.vy-=p*45;Sh.energy=Math.max(Sh.energy,p);Sh.shake=Math.max(Sh.shake,p);Sh.lean=side*p;leanT=1;
 const q=Q[S.quality].rain>300?1:.5,n=(8+p*22)*q|0,pt=side>0?tw(95,-30):tw(-84,-24),bx=pt.x,by=pt.y;
 for(let i=0;i<n;i++)spawnSplash(bx+rnd(-10,10),by,rnd(-70,70)+side*30,-rnd(120,330)*(.4+p),rnd(.6,1.2),rnd(1,2.4));
 if(p>.5)for(let i=0;i<3;i++)spawnDrop();
 const pan=side*.6;
 burst({type:"bandpass",f0:2200,f1:500,q:.7,dur:1.1,att:.04,v:.3+p*.6,pan,ch:"ocean"});
 burst({br:1,type:"lowpass",f0:200,f1:60,dur:.6,att:.02,v:.8+p*1.5,pan,ch:"ship"});
 burst({type:"bandpass",f0:3200,f1:1400,q:2,dur:1.8,att:.4,v:.1+p*.15,pan:-pan,ch:"ocean",at:(A.ctx&&A.ctx.currentTime||0)+.9});
 if(Math.random()<.7)creak(.6+p)}
